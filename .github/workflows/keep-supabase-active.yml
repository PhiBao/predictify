name: Keep Supabase Active

on:
  schedule:
    # Every 3 days at 6:00 UTC — Supabase free tier pauses after 7 days idle
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase at $(date -u)"
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/sync_metadata?select=id&limit=1" \
            || echo "Ping failed (Supabase may be paused or unreachable)"
